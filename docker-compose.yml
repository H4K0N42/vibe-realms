services:
  vibe-realms:
    build: .
    image: vibe-realms:latest
    restart: unless-stopped
    ports:
      # Plain HTTP. Pangolin terminates TLS and proxies to this.
      - "3000:3000"
    environment:
      PORT: "3000"
      FR_DATA_DIR: /data
    volumes:
      # A bind mount, not a named volume: the database sits in ./DATA next to
      # the compose file, visible and backed up like any other file on the
      # host. This only works because the image runs as the `node` user
      # (uid 1000, see Dockerfile), matching the uid that owns a freshly
      # created host directory on most single-user Linux boxes. If that does
      # not match here, either `chown -R 1000 ./DATA` once, or uncomment the
      # `user:` line below with your own host uid:gid.
      - ./DATA:/data
    # user: "1000:1000"
